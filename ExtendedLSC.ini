[General]
; Key to open menu when near a vehicle (not in LSC)
MenuKey=F5

; Automatically open when entering LSC zones
AutoOpenInLSC=true

[Menu]
; Menu position on screen (TopLeft, TopRight, BottomLeft, BottomRight)
Position=TopLeft

; Custom banner (leave empty for default)
BannerPath=

[Debug]
; Enable debug logging to ExtendedLSC.log
EnableLogging=false

; Show debug overlay with vehicle info
ShowDebugInfo=false
